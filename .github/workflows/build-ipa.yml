name: Build IPA

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project TandemAgent.xcodeproj \
            -scheme TandemAgent \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Tandem.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH"
            find build -name "*.app" -maxdepth 5
            exit 1
          fi
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          IPA_NAME="TandemAgent-$VERSION.ipa"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          rm -rf Payload "$IPA_NAME"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TandemAgent-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Attach IPA to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_NAME }}
