name: QA Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  screenshots:
    name: Simulator QA screenshots
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build QA configuration (simulator)
        run: |
          xcodebuild \
            -project TandemAgent.xcodeproj \
            -scheme TandemAgent \
            -configuration QA \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build-qa" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Boot simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -Eo 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          echo "Runtime: $RUNTIME"
          for TYPE in "iPhone 17 Pro" "iPhone 16 Pro" "iPhone 15 Pro" "iPhone 16"; do
            if DEVICE_ID=$(xcrun simctl create "Tandem-QA" "$TYPE" "$RUNTIME" 2>/dev/null); then
              echo "Device type: $TYPE"
              break
            fi
          done
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone device type could be created"
            xcrun simctl list devicetypes | grep iPhone
            exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus booted -b
          xcrun simctl ui booted appearance dark
          xcrun simctl status_bar booted override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4

      - name: Install app
        run: |
          APP_PATH="build-qa/Build/Products/QA-iphonesimulator/Tandem.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "QA app not found at $APP_PATH"
            find build-qa -name "*.app" -maxdepth 5
            exit 1
          fi
          xcrun simctl install booted "$APP_PATH"

      - name: Capture screenshots
        run: |
          mkdir -p shots
          capture() {
            name="$1"; shift
            xcrun simctl launch --terminate-running-process booted dev.joe.tandem "$@" || true
            sleep 6
            xcrun simctl io booted screenshot "shots/$name.png"
          }
          capture 01-gate -QAGate
          capture 02-onboarding -QAOnboard
          capture 03-home -QAMain
          capture 04-approvals -QAMain -QAScreen approvals
          capture 05-tasks -QAMain -QAStartTab 1
          capture 06-newtask -QAMain -QAScreen newtask
          capture 07-chat -QAMain -QAStartTab 2 -QAChat
          capture 08-chat-empty -QAMain -QAStartTab 2
          capture 09-memory -QAMain -QAStartTab 3
          capture 10-settings -QAMain -QAStartTab 4
          capture 11-invitekeys -QAMain -QAScreen invitekeys
          capture 12-provider -QAMain -QAScreen provider
          ls -la shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tandem-qa-screenshots
          path: shots/
          if-no-files-found: error
